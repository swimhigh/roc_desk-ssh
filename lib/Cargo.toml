[package]
name = "roc_desk_ssh"
version = "0.1.0"
edition = "2021"

[dependencies]
roc_desk_core = { git = "https://github.com/swimhigh/roc_desk-common", package = "roc_desk_core", tag = "common-v0.10.0" }
roc_desk_common = { git = "https://github.com/swimhigh/roc_desk-common", package = "roc_desk_common", tag = "common-v0.10.0" }
roc_desk_protocol = { path = "../protocol" }
tauri = { version = "2" }
tauri-plugin-opener = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "fs", "process"] }
async-trait = "0.1"
rusqlite = { version = "0.39", features = ["bundled"] }
r2d2 = "0.8"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
base64 = "0.22"
trash = "5"

# SSH / SFTP
russh = "0.46"
russh-keys = "0.46"
russh-sftp = "2"

# Windows 远程 Agent 协议：TLS 用法和 protocol 使用方保持一致（显式 `ring`）。
tokio-rustls = { version = "0.26", default-features = false, features = ["tls12", "logging", "ring"] }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"] }
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
# RDP：拉起系统自带 wfreerdp.exe 并用 Win32 API 把它的顶层窗口挂成 roc_desk 主窗口的
# 属主窗口（见 src/rdp/mod.rs 顶部注释）。版本对齐 tauri 自己内部依赖的 windows crate。
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi"] }

[features]
default = ["business"]
business = []
